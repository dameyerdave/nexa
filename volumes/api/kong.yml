_format_version: '2.1'
_transform: true

###
### Consumers / Users
###
consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
      - key: $SUPABASE_PUBLISHABLE_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY
      - key: $SUPABASE_SECRET_KEY

###
### Access Control List
###
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

###
### API Routes
###
services:
  ## Open Auth routes
  - name: auth-v1-open
    _comment: 'Auth: /auth/v1/verify* -> http://auth:9999/verify*'
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
  - name: auth-v1-open-callback
    _comment: 'Auth: /auth/v1/callback* -> http://auth:9999/callback*'
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
  - name: auth-v1-open-authorize
    _comment: 'Auth: /auth/v1/authorize* -> http://auth:9999/authorize*'
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors
  - name: auth-v1-open-jwks
    _comment: 'Auth: /auth/v1/.well-known/jwks.json -> http://auth:9999/.well-known/jwks.json'
    url: http://auth:9999/.well-known/jwks.json
    routes:
      - name: auth-v1-open-jwks
        strip_path: true
        paths:
          - /auth/v1/.well-known/jwks.json
    plugins:
      - name: cors

  - name: auth-v1-open-sso-acs
    url: "http://auth:9999/sso/saml/acs"
    routes:
      - name: auth-v1-open-sso-acs
        strip_path: true
        paths:
        - /auth/v1/sso/saml/acs
    plugins:
      - name: cors

  - name: auth-v1-open-sso-metadata
    url: "http://auth:9999/sso/saml/metadata"
    routes:
      - name: auth-v1-open-sso-metadata
        strip_path: true
        paths:
        - /auth/v1/sso/saml/metadata
    plugins:
      - name: cors

  ## Secure Auth routes
  - name: auth-v1
    _comment: 'Auth: /auth/v1/* -> http://auth:9999/*'
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## OpenAPI root - admin only
  # Routed through the portal (not straight to rest:3000) so the portal can
  # stamp who's actually behind the request - see server/utils/studio-proxy.ts
  # and volumes/db/audit.sql. X-Kong-Proxy-Secret proves to the portal that
  # this came through Kong's key-auth/acl checks, not a direct hit on the
  # portal's own published port.
  - name: rest-v1-openapi
    _comment: 'PostgREST OpenAPI root: /rest/v1/ -> portal proxy -> <http://rest:3000/> (admin only). See <https://github.com/orgs/supabase/discussions/42949>'
    url: http://portal:3000/api/proxy/rest/
    routes:
      - name: rest-v1-openapi-root
        strip_path: true
        expression: 'http.path == "/rest/v1/"'
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
              - "X-Kong-Proxy-Secret: $SUPABASE_SERVICE_KEY"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin

  ## Secure PostgREST routes
  - name: rest-v1
    _comment: 'PostgREST: /rest/v1/* -> portal proxy -> http://rest:3000/* (see rest-v1-openapi comment above)'
    url: http://portal:3000/api/proxy/rest/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
              - "X-Kong-Proxy-Secret: $SUPABASE_SERVICE_KEY"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Secure GraphQL routes
  - name: graphql-v1
    _comment: 'PostgREST: /graphql/v1/* -> http://rest:3000/rpc/graphql'
    url: http://rest:3000/rpc/graphql
    routes:
      - name: graphql-v1-all
        strip_path: true
        paths:
          - /graphql/v1
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Content-Profile: graphql_public"
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Secure Realtime routes
  - name: realtime-v1-ws
    _comment: 'Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
    url: http://realtime-dev.supabase-realtime:4000/socket
    protocol: ws
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "x-api-key:$LUA_RT_WS_EXPR"
          replace:
            querystring:
              - "apikey:$LUA_RT_WS_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # Block access to /realtime/v1/api/openapi
  - name: realtime-v1-rest-openapi
    _comment: 'Realtime: /realtime/v1/api/openapi/* -> http://realtime:4000/api/openapi/* (blocked)'
    url: http://realtime-dev.supabase-realtime:4000/api/openapi
    protocol: http
    routes:
      - name: realtime-v1-rest-openapi
        strip_path: true
        paths:
          - /realtime/v1/api/openapi
    plugins:
      - name: request-termination
        config:
          status_code: 403
          message: "Access is forbidden."

  # Block access to /realtime/v1/api/tenants
  - name: realtime-v1-rest-tenants
    _comment: 'Realtime: /realtime/v1/api/tenants/* -> http://realtime:4000/api/tenants/* (blocked)'
    url: http://realtime-dev.supabase-realtime:4000/api/tenants
    protocol: http
    routes:
      - name: realtime-v1-rest-tenants
        strip_path: true
        paths:
          - /realtime/v1/api/tenants
    plugins:
      - name: request-termination
        config:
          status_code: 403
          message: "Access is forbidden."

  - name: realtime-v1-rest
    _comment: 'Realtime: /realtime/v1/api/* -> http://realtime:4000/api/*'
    url: http://realtime-dev.supabase-realtime:4000/api
    protocol: http
    routes:
      - name: realtime-v1-rest
        strip_path: true
        paths:
          - /realtime/v1/api
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Storage API endpoint (with Authorization header transformation).
  ## No key-auth - S3 protocol requests don't carry an apikey header.
  ##
  ## The request-transformer translates opaque API keys to asymmetric JWTs
  ## and passes through existing Authorization headers (user JWTs, AWS SigV4).
  ## When no Authorization or apikey header is present (S3 presigned URLs),
  ## the Lua expression evaluates to nil which Kong renders as empty string.
  ## The post-function strips this empty header so Storage's S3 signature
  ## verification falls through to query-parameter parsing.
  - name: storage-v1
    _comment: 'Storage: /storage/v1/* -> http://storage:5000/*'
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: post-function
        config:
          access:
            - |
              local auth = kong.request.get_header("authorization")
              if auth == nil or auth == "" or auth:find("^%s*$") then
                kong.service.request.clear_header("authorization")
              end

  ## Edge Functions routes
  - name: functions-v1
    _comment: 'Edge Functions: /functions/v1/* -> http://functions:9000/*'
    url: http://functions:9000/
    read_timeout: 150000
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors

  ## OAuth 2.0 Authorization Server Metadata (RFC 8414)
  - name: well-known-oauth
    _comment: 'Auth: /.well-known/oauth-authorization-server -> http://auth:9999/.well-known/oauth-authorization-server'
    url: http://auth:9999/.well-known/oauth-authorization-server
    routes:
      - name: well-known-oauth
        strip_path: true
        paths:
          - /.well-known/oauth-authorization-server
    plugins:
      - name: cors

  ## Analytics routes
  ## Not used - Studio and Vector talk directly to analytics via Docker networking.
  ## If external access is needed, add routes with key-auth matching Logflare's x-api-key auth.
  # - name: analytics-v1-api
  #   _comment: 'Analytics: /analytics/v1/api/endpoints/* -> http://logflare:4000/api/endpoints/*'
  #   url: http://analytics:4000/api/endpoints
  #   routes:
  #     - name: analytics-v1-api
  #       strip_path: true
  #       paths:
  #         - /analytics/v1/api/endpoints/
  # - name: analytics-v1
  #   _comment: 'Analytics: /analytics/v1/* -> http://logflare:4000/*'
  #   url: http://analytics:4000/
  #   routes:
  #     - name: dashboard-v1-all
  #       strip_path: true
  #       paths:
  #         - /analytics/v1
  #   plugins:
  #     - name: cors
  #     - name: basic-auth
  #       config:
  #         hide_credentials: true

  ## Secure Database routes
  # Routed through the portal (not straight to meta:8080) so the portal can
  # stamp who's actually behind the request - see server/utils/studio-proxy.ts
  # and volumes/db/audit.sql. X-Kong-Proxy-Secret proves to the portal that
  # this came through Kong's key-auth/acl checks, not a direct hit on the
  # portal's own published port.
  - name: meta
    _comment: 'pg-meta: /pg/* -> portal proxy -> http://pg-meta:8080/*'
    url: http://portal:3000/api/proxy/meta/
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Kong-Proxy-Secret: $SUPABASE_SERVICE_KEY"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin

  ## Block access to /api/mcp
  - name: mcp-blocker
    _comment: 'Block direct access to /api/mcp'
    url: http://studio:3000/api/mcp
    routes:
      - name: mcp-blocker-route
        strip_path: true
        paths:
          - /api/mcp
    plugins:
      - name: request-termination
        config:
          status_code: 403
          message: "Access is forbidden."

  ## MCP endpoint - local access
  - name: mcp
    _comment: 'MCP: /mcp -> http://studio:3000/api/mcp (local access)'
    url: http://studio:3000/api/mcp
    routes:
      - name: mcp
        strip_path: true
        paths:
          - /mcp
    plugins:
      # Block access to /mcp by default
      - name: request-termination
        config:
          status_code: 403
          message: "Access is forbidden."
      # Enable local access (danger zone!)
      # 1. Comment out the 'request-termination' section above
      # 2. Uncomment the entire section below, including 'deny'
      # 3. Add your local IPs to the 'allow' list
      #- name: cors
      #- name: ip-restriction
      #  config:
      #    allow:
      #      - 127.0.0.1
      #      - ::1
      #    deny: []

  ## Protected Dashboard - catch all remaining routes
  - name: dashboard
    _comment: >
      Studio: /* -> portal proxy -> http://studio:3000/*. Routed through the
      portal (not straight to studio:3000) so the portal can require a real,
      editor-level Metabase session before forwarding - see
      server/api/proxy/studio/[...path].ts. Studio's embedded service_role
      key means anyone who can reach its shell has full database access, so
      this replaced the original design (Kong Basic Auth with credentials
      embedded in the iframe URL) once that turned out to be blocked outright
      by modern browsers for cross-origin iframe src - confirmed live.
      X-Kong-Proxy-Secret proves to the portal this came through Kong's
      key-auth checks, not a direct hit on the portal's own published port.
    url: http://portal:3000/api/proxy/studio/
    routes:
      - name: dashboard-all
        strip_path: true
        paths:
          - /
    plugins:
      - name: cors
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Kong-Proxy-Secret: $SUPABASE_SERVICE_KEY"
      - name: response-transformer
        config:
          remove:
            headers:
              - X-Frame-Options
              - Content-Security-Policy
        # Studio sends X-Frame-Options: DENY and a frame-ancestors 'none'
        # CSP by default (confirmed live) - a generic clickjacking default,
        # not tied to any paid feature, safe to drop here since this route
        # is already gated by the editor-session proxy above.

  ## Metabase - served on its OWN listener (net.dst.port 8002, published as
  ## ${KONG_METABASE_PORT:-8002}), not a subpath of the routes above: like
  ## Studio, Metabase's frontend assumes it's served at the root of its own
  ## origin, so it can't share port 8000's "/" catch-all with Studio.
  ##
  ## The portal is the only intended way to log in - it calls Metabase's
  ## POST /api/session directly over the internal Docker network
  ## (http://metabase:3000/api/session), which never touches Kong at all.
  ## This route exists to stop anyone else from reaching that same login
  ## endpoint through the *published* port and bypassing the portal's 2FA
  ## step entirely. Session cookies from a login the portal already
  ## completed still work fine here - only issuing a *new* session from
  ## outside is blocked.
  - name: metabase-session-block
    _comment: 'Metabase: block POST /api/session on the published port - login only happens via the portal, server-to-server'
    url: http://metabase:3000/api/session
    routes:
      - name: metabase-session-block-route
        expression: 'net.dst.port == 8002 && http.path == "/api/session" && http.method == "POST"'
        priority: 1000
    plugins:
      - name: request-termination
        config:
          status_code: 403
          message: "Direct sign-in is disabled - sign in through the portal."

  - name: metabase-add-database-block
    _comment: >
      Metabase: block POST /api/database on the published port - no native
      Metabase setting exists to stop even a superuser from adding a
      database connection (that granularity of admin permission is an
      Enterprise-only feature - confirmed live via GET /api/setting,
      enable-advanced-permissions? is false and unavailable on this
      edition), so this is enforced at the network layer instead. Doesn't
      affect the portal - it never calls this endpoint - or anything
      reaching Metabase over the internal Docker network directly (same
      trust boundary as metabase-session-block above).
    url: http://metabase:3000/api/database
    routes:
      - name: metabase-add-database-block-route
        expression: 'net.dst.port == 8002 && http.path == "/api/database" && http.method == "POST"'
        priority: 1000
    plugins:
      - name: request-termination
        config:
          status_code: 403
          message: "Adding database connections is disabled on this instance."

  - name: metabase
    _comment: >
      Metabase: net.dst.port 8002 -> http://metabase:3000/* (unchanged path -
      see comment above). Strips the frame-ancestors 'none' CSP Metabase
      sends by default - full interactive iframe embedding is an
      Enterprise/Pro-only feature there (confirmed live: enabling it and
      setting an allowed origin both fail outright on the open-source
      image this stack uses), and this is a deliberate choice to embed our
      own self-hosted instance for our own authenticated users anyway,
      through the same reverse proxy already in front of it - see
      README.md "Authentication" for the full reasoning.
    url: http://metabase:3000/
    routes:
      - name: metabase-all
        expression: 'net.dst.port == 8002'
    plugins:
      - name: cors
      - name: response-transformer
        config:
          remove:
            headers:
              - X-Frame-Options
              - Content-Security-Policy
