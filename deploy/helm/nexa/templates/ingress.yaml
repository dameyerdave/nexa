{{- $domain := .Values.global.domain -}}
{{- $tls := ne .Values.global.clusterIssuer "" -}}
{{- $svcs := dict "portal" $domain "kong" (printf "api.%s" $domain) "metabase" (printf "analytics.%s" $domain) -}}
{{- range $svc, $host := $svcs }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nexa.fullname" $ }}-{{ $svc }}
  labels:
    {{- include "nexa.labels" $ | nindent 4 }}
  annotations:
    {{- if $tls }}
    cert-manager.io/cluster-issuer: {{ $.Values.global.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.global.ingressClassName }}
  {{- if $tls }}
  tls:
    - hosts: [{{ $host }}]
      secretName: {{ include "nexa.fullname" $ }}-{{ $svc }}-tls
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svc }}
                port:
                  # kong publishes both 8000 (http) and 8443 (https); portal
                  # and metabase publish a single port. See each service's
                  # own Service manifest for the exact port name/number.
                  number: {{ if eq $svc "kong" }}8000{{ else }}3000{{ end }}
---
{{- end }}
