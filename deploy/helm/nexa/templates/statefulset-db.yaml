apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nexa.fullname" . }}-db
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "nexa.fullname" . }}-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "nexa.selectorLabels" (dict "component" "db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexa.selectorLabels" (dict "component" "db") | nindent 8 }}
      annotations:
        {{- include "nexa.podAnnotations" . | nindent 8 }}
    spec:
      # fsGroup alone only fixes group ownership, not the UID postgres
      # actually checks - and unlike the plain postgres image, this image's
      # entrypoint doesn't self-heal a UID mismatch (it just FATALs "wrong
      # ownership"). The initContainer below chowns as the image's own
      # `postgres` user so the UID always matches what the main container
      # resolves at runtime.
      securityContext:
        fsGroup: 999
      initContainers:
        - name: fix-data-ownership
          image: "{{ .Values.images.db.repository }}:{{ .Values.images.db.tag }}"
          # chown alone doesn't fix mode - postgres also FATALs on a freshly
          # provisioned volume's default (group/other-readable) permissions,
          # demanding exactly 0700 or 0750. mkdir -p the PGDATA subdirectory
          # itself so it exists (and gets chowned/chmoded) before initdb runs.
          command: ["sh", "-c", "mkdir -p /var/lib/postgresql/data/pgdata && chown -R postgres:postgres /var/lib/postgresql/data && chmod -R 0700 /var/lib/postgresql/data"]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      containers:
        - name: db
          image: "{{ .Values.images.db.repository }}:{{ .Values.images.db.tag }}"
          {{- include "nexa.envFrom" . | nindent 10 }}
          env:
            # Overrides the client-facing POSTGRES_HOST from the shared
            # ConfigMap (a DNS name) with the unix socket path this
            # container needs for itself - env: takes precedence over
            # envFrom for the same key.
            - name: POSTGRES_HOST
              value: /var/run/postgresql
            # A block-storage-provisioned PVC's root often has a pre-existing
            # lost+found directory, which initdb refuses to initialize into
            # ("directory exists but is not empty") - so it needs a
            # subdirectory of the mount, not the mount root itself.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: PGPORT
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: POSTGRES_PORT } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: POSTGRES_PASSWORD } }
            - name: PGDATABASE
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: POSTGRES_DB } }
            - name: JWT_EXP
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: JWT_EXPIRY } }
          # `args`, not `command`: the image's ENTRYPOINT must still run -
          # it's what drops from root to the postgres user before exec'ing
          # this. k8s `command` replaces ENTRYPOINT (Docker Compose's
          # `command` only replaces CMD), so using `command` here made
          # postgres launch directly as root and refuse to start.
          #
          # data_directory is set explicitly here because the image's baked-in
          # postgresql.conf sets its own `data_directory` pointing at the
          # mount root - and per Postgres's own precedence rules, that value
          # OVERRIDES PGDATA/-D entirely. Without this, initdb writes to the
          # $PGDATA subdirectory but the server then looks in the mount root
          # instead and FATALs "not a valid data directory" every restart.
          args: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "data_directory=/var/lib/postgresql/data/pgdata", "-c", "log_min_messages=fatal"]
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "localhost"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "localhost"] }
            periodSeconds: 10
            initialDelaySeconds: 15
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            # subPath per file, not a directory-level mount: the image bakes
            # its own default migrations into these same two directories
            # (which create the `extensions` schema, supabase_admin, etc.
            # before ours run) - docker-compose.yml's per-file bind mounts
            # add to that directory's contents, but a ConfigMap mounted at
            # the directory itself REPLACES it wholesale, silently deleting
            # every one of the image's own baked-in scripts. subPath mounts
            # just the one file, leaving the rest of the directory intact.
            - { name: db-migrations, mountPath: /docker-entrypoint-initdb.d/migrations/97-_supabase.sql, subPath: 97-_supabase.sql }
            - { name: db-migrations, mountPath: /docker-entrypoint-initdb.d/migrations/97-metabase.sql, subPath: 97-metabase.sql }
            - { name: db-migrations, mountPath: /docker-entrypoint-initdb.d/migrations/99-realtime.sql, subPath: 99-realtime.sql }
            - { name: db-migrations, mountPath: /docker-entrypoint-initdb.d/migrations/99-logs.sql, subPath: 99-logs.sql }
            - { name: db-migrations, mountPath: /docker-entrypoint-initdb.d/migrations/99-pooler.sql, subPath: 99-pooler.sql }
            - { name: db-init-scripts, mountPath: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql, subPath: 98-webhooks.sql }
            - { name: db-init-scripts, mountPath: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql, subPath: 99-roles.sql }
            - { name: db-init-scripts, mountPath: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql, subPath: 99-jwt.sql }
          resources:
            {{- toYaml .Values.resources.large | nindent 12 }}
      volumes:
        - name: db-migrations
          configMap: { name: {{ include "nexa.fullname" . }}-db-migrations }
        - name: db-init-scripts
          configMap: { name: {{ include "nexa.fullname" . }}-db-init-scripts }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClassName }}
        storageClassName: {{ .Values.global.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.db.size }}
---
apiVersion: v1
kind: Service
metadata:
  # Deliberately unprefixed (unlike most other Services in this chart) -
  # config.POSTGRES_HOST and every other service's DATABASE_URL-style env
  # var hardcode "db" as the hostname, matching docker-compose.yml. One
  # release per namespace is assumed - see deploy/helm/nexa/README.md.
  name: db
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "nexa.selectorLabels" (dict "component" "db") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
