apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nexa.fullname" . }}-metabase-db
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "nexa.fullname" . }}-metabase-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "nexa.selectorLabels" (dict "component" "metabase-db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexa.selectorLabels" (dict "component" "metabase-db") | nindent 8 }}
    spec:
      # See the fsGroup note in statefulset-db.yaml - same reasoning applies
      # here, even though this postgres:16-alpine image hasn't hit it yet.
      securityContext:
        fsGroup: 999
      containers:
        - name: metabase-db
          image: "{{ .Values.images.metabaseDb.repository }}:{{ .Values.images.metabaseDb.tag }}"
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: MB_DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: MB_DB_PASS } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: MB_DB_DBNAME } }
            # A block-storage-provisioned PVC's root often has a pre-existing
            # lost+found directory, which initdb refuses to initialize into
            # ("directory exists but is not empty") - so it needs a
            # subdirectory of the mount, not the mount root itself.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 10
            initialDelaySeconds: 15
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          resources:
            {{- toYaml .Values.resources.medium | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClassName }}
        storageClassName: {{ .Values.global.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.metabaseDb.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: metabase-db   # unprefixed - see the note in statefulset-db.yaml
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "nexa.selectorLabels" (dict "component" "metabase-db") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
