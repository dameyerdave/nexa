{{/*
kong.yml hardcodes upstream hostnames (http://auth:9999, http://rest:3000,
...) matching docker-compose's service names - Services in this chart use
those same unprefixed names precisely so this file can be loaded verbatim.
The one exception is realtime-dev.supabase-realtime: a Kubernetes Service
name can't contain a dot, so that one hostname is rewritten to "realtime"
below. See deploy/helm/nexa/README.md for what that may affect.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexa.fullname" . }}-kong
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
data:
  kong.yml: |-
{{ .Files.Get "files/api/kong.yml" | replace "realtime-dev.supabase-realtime" "realtime" | indent 4 }}
  kong-entrypoint.sh: |-
{{ .Files.Get "files/api/kong-entrypoint.sh" | indent 4 }}
