apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexa.fullname" . }}-metabase
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.metabase }}
  selector:
    matchLabels:
      {{- include "nexa.selectorLabels" (dict "component" "metabase") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexa.selectorLabels" (dict "component" "metabase") | nindent 8 }}
    spec:
      containers:
        - name: metabase
          image: "{{ .Values.images.metabase.repository }}:{{ .Values.images.metabase.tag }}"
          {{- include "nexa.envFrom" . | nindent 10 }}
          env:
            # Metabase's own application data lives in a dedicated `metabase`
            # database on the same Supabase Postgres instance (see
            # volumes/db/metabase.sql), not a separate Postgres container.
            - { name: MB_DB_TYPE, value: postgres }
            - { name: MB_DB_HOST, value: db }
            - name: MB_DB_PORT
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: POSTGRES_PORT } }
            - { name: MB_DB_DBNAME, value: metabase }
            - { name: MB_DB_USER, value: postgres }
            - name: MB_DB_PASS
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: POSTGRES_PASSWORD } }
            - name: MB_SITE_NAME
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: APP_NAME } }
            - name: MB_GOOGLE_AUTH_CLIENT_ID
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: GOOGLE_CLIENT_ID } }
            - name: MB_GOOGLE_AUTH_AUTO_CREATE_ACCOUNTS_DOMAIN
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: GOOGLE_AUTH_ALLOWED_DOMAIN } }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 15
            initialDelaySeconds: 60
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources.large | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: metabase
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nexa.selectorLabels" (dict "component" "metabase") | nindent 4 }}
  ports:
    - port: 3000
      targetPort: 3000
