apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexa.fullname" . }}-portal
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.portal }}
  selector:
    matchLabels:
      {{- include "nexa.selectorLabels" (dict "component" "portal") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexa.selectorLabels" (dict "component" "portal") | nindent 8 }}
      annotations:
        {{- include "nexa.podAnnotations" . | nindent 8 }}
    spec:
      containers:
        - name: portal
          image: "{{ .Values.images.portal.repository }}:{{ .Values.images.portal.tag }}"
          env:
            - name: NUXT_PUBLIC_APP_NAME
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: APP_NAME } }
            - name: NUXT_PUBLIC_SUPABASE_URL
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: SUPABASE_PUBLIC_URL } }
            - name: NUXT_PUBLIC_SUPABASE_ANON_KEY
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: ANON_KEY } }
            - name: NUXT_PUBLIC_GOOGLE_ENABLED
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: GOOGLE_ENABLED } }
            - name: NUXT_PUBLIC_DATA_MODEL_LABEL
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: DATA_MODEL_LABEL } }
            - name: NUXT_PUBLIC_DATA_MODEL_URL
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: SUPABASE_PUBLIC_URL } }
            - name: NUXT_PUBLIC_DATA_ANALYTICS_LABEL
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: DATA_ANALYTICS_LABEL } }
            - name: NUXT_PUBLIC_DATA_ANALYTICS_URL
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: METABASE_PUBLIC_URL } }
            # Server-only - used by server/api/admin/* and server/api/studio-link
            # to talk to the Supabase Admin API / Metabase Admin API and to
            # gate who can manage roles. Never exposed to the browser.
            - name: NUXT_SERVICE_ROLE_KEY
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: SERVICE_ROLE_KEY } }
            - name: NUXT_PORTAL_ADMIN_EMAILS
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: PORTAL_ADMIN_EMAILS } }
            - name: NUXT_DASHBOARD_USERNAME
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: DASHBOARD_USERNAME } }
            - name: NUXT_DASHBOARD_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: DASHBOARD_PASSWORD } }
            - name: NUXT_METABASE_ADMIN_EMAIL
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: METABASE_ADMIN_EMAIL } }
            - name: NUXT_METABASE_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: METABASE_ADMIN_PASSWORD } }
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket: { port: 3000 }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.small | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nexa.selectorLabels" (dict "component" "portal") | nindent 4 }}
  ports:
    - port: 3000
      targetPort: 3000
