apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexa.fullname" . }}-realtime
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.realtime }}
  selector:
    matchLabels:
      {{- include "nexa.selectorLabels" (dict "component" "realtime") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexa.selectorLabels" (dict "component" "realtime") | nindent 8 }}
    spec:
      containers:
        - name: realtime
          image: "{{ .Values.images.realtime.repository }}:{{ .Values.images.realtime.tag }}"
          {{- include "nexa.envFrom" . | nindent 10 }}
          env:
            - { name: PORT, value: "4000" }
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: POSTGRES_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: POSTGRES_PORT } }
            - { name: DB_USER, value: supabase_admin }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: POSTGRES_PASSWORD } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: POSTGRES_DB } }
            - { name: DB_AFTER_CONNECT_QUERY, value: "SET search_path TO _realtime" }
            - name: DB_ENC_KEY
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: REALTIME_DB_ENC_KEY } }
            - name: API_JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: JWT_SECRET } }
            - name: METRICS_JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: JWT_SECRET } }
            - { name: ERL_AFLAGS, value: "-proto_dist inet_tcp" }
            - { name: DNS_NODES, value: "''" }
            - { name: RLIMIT_NOFILE, value: "10000" }
            - { name: APP_NAME, value: realtime }
            - { name: SEED_SELF_HOST, value: "true" }
            - { name: RUN_JANITOR, value: "true" }
            - { name: DISABLE_HEALTHCHECK_LOGGING, value: "true" }
          ports:
            - containerPort: 4000
          # docker-compose's healthcheck curls /api/tenants/realtime-dev/health
          # with an Authorization header - k8s probes can't source a header
          # value from a Secret (only static values, which would mean
          # writing ANON_KEY in cleartext into this manifest), so this is
          # a plain TCP check instead: weaker, but doesn't leak a secret
          # into `kubectl get deployment -o yaml`.
          readinessProbe:
            tcpSocket: { port: 4000 }
            periodSeconds: 15
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources.medium | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  # Unprefixed and shortened from docker-compose's realtime-dev.supabase-
  # realtime (a Service name can't contain a dot) - kong.yml is patched to
  # match, see templates/configmap-kong.yaml. Self-host tenant is still
  # named "realtime-dev" (SEED_SELF_HOST) - this rename is network routing
  # only and hasn't been verified against realtime-js client behavior.
  name: realtime
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nexa.selectorLabels" (dict "component" "realtime") | nindent 4 }}
  ports:
    - port: 4000
      targetPort: 4000
