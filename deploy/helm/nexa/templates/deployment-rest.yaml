apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexa.fullname" . }}-rest
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.rest }}
  selector:
    matchLabels:
      {{- include "nexa.selectorLabels" (dict "component" "rest") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexa.selectorLabels" (dict "component" "rest") | nindent 8 }}
      annotations:
        {{- include "nexa.podAnnotations" . | nindent 8 }}
    spec:
      containers:
        - name: rest
          image: "{{ .Values.images.rest.repository }}:{{ .Values.images.rest.tag }}"
          command: ["postgrest"]
          {{- include "nexa.envFrom" . | nindent 10 }}
          env:
            - name: PGRST_DB_URI
              value: "postgres://authenticator:$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - { name: PGRST_DB_ANON_ROLE, value: anon }
            - { name: PGRST_ADMIN_SERVER_PORT, value: "3001" }
            - { name: PGRST_ADMIN_SERVER_HOST, value: localhost }
            - { name: PGRST_DB_USE_LEGACY_GUCS, value: "false" }
            # JWT_JWKS (asymmetric keys) isn't wired up for this chart yet
            # (same "optional/advanced" scope as scripts/generate-keys.sh) -
            # PostgREST verifies with the legacy symmetric JWT_SECRET.
            - name: PGRST_JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: JWT_SECRET } }
            - name: PGRST_APP_SETTINGS_JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: JWT_SECRET } }
            - name: PGRST_APP_SETTINGS_JWT_EXP
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: JWT_EXPIRY } }
          ports:
            - containerPort: 3000
          readinessProbe:
            exec: { command: ["postgrest", "--ready"] }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.small | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rest
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nexa.selectorLabels" (dict "component" "rest") | nindent 4 }}
  ports:
    - port: 3000
      targetPort: 3000
