apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexa.fullname" . }}-auth
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.auth }}
  selector:
    matchLabels:
      {{- include "nexa.selectorLabels" (dict "component" "auth") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexa.selectorLabels" (dict "component" "auth") | nindent 8 }}
    spec:
      containers:
        - name: auth
          image: "{{ .Values.images.auth.repository }}:{{ .Values.images.auth.tag }}"
          {{- include "nexa.envFrom" . | nindent 10 }}
          env:
            - { name: GOTRUE_API_HOST, value: "0.0.0.0" }
            - { name: GOTRUE_API_PORT, value: "9999" }
            - { name: GOTRUE_DB_DRIVER, value: postgres }
            - name: GOTRUE_DB_DATABASE_URL
              value: "postgres://supabase_auth_admin:$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - { name: GOTRUE_JWT_ADMIN_ROLES, value: service_role }
            - { name: GOTRUE_JWT_AUD, value: authenticated }
            - { name: GOTRUE_JWT_DEFAULT_GROUP_NAME, value: authenticated }
            - name: GOTRUE_JWT_EXP
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: JWT_EXPIRY } }
            - name: GOTRUE_JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: JWT_SECRET } }
            - { name: GOTRUE_JWT_ISSUER, value: "$(API_EXTERNAL_URL)" }
            - name: GOTRUE_SITE_URL
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: SITE_URL } }
            - name: GOTRUE_URI_ALLOW_LIST
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: ADDITIONAL_REDIRECT_URLS } }
            - name: GOTRUE_DISABLE_SIGNUP
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: DISABLE_SIGNUP } }
            - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: ENABLE_EMAIL_SIGNUP } }
            - name: GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: ENABLE_ANONYMOUS_USERS } }
            - name: GOTRUE_MAILER_AUTOCONFIRM
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: ENABLE_EMAIL_AUTOCONFIRM } }
            - name: GOTRUE_SMTP_ADMIN_EMAIL
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: SMTP_ADMIN_EMAIL } }
            - name: GOTRUE_SMTP_HOST
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: SMTP_HOST } }
            - name: GOTRUE_SMTP_PORT
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: SMTP_PORT } }
            - name: GOTRUE_SMTP_USER
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: SMTP_USER } }
            - name: GOTRUE_SMTP_PASS
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: SMTP_PASS } }
            - name: GOTRUE_SMTP_SENDER_NAME
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: SMTP_SENDER_NAME } }
            - name: GOTRUE_MAILER_URLPATHS_INVITE
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: MAILER_URLPATHS_INVITE } }
            - name: GOTRUE_MAILER_URLPATHS_CONFIRMATION
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: MAILER_URLPATHS_CONFIRMATION } }
            - name: GOTRUE_MAILER_URLPATHS_RECOVERY
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: MAILER_URLPATHS_RECOVERY } }
            - name: GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: MAILER_URLPATHS_EMAIL_CHANGE } }
            - name: GOTRUE_EXTERNAL_PHONE_ENABLED
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: ENABLE_PHONE_SIGNUP } }
            - name: GOTRUE_SMS_AUTOCONFIRM
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: ENABLE_PHONE_AUTOCONFIRM } }
            - name: GOTRUE_EXTERNAL_GOOGLE_ENABLED
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: GOOGLE_ENABLED } }
            - name: GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: GOOGLE_CLIENT_ID } }
            - name: GOTRUE_EXTERNAL_GOOGLE_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: GOOGLE_SECRET } }
            - { name: GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI, value: "$(API_EXTERNAL_URL)/callback" }
          ports:
            - containerPort: 9999
          readinessProbe:
            httpGet: { path: /health, port: 9999 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 9999 }
            periodSeconds: 10
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources.small | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nexa.selectorLabels" (dict "component" "auth") | nindent 4 }}
  ports:
    - port: 9999
      targetPort: 9999
