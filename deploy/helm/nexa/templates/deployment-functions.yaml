apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexa.fullname" . }}-functions
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.functions }}
  selector:
    matchLabels:
      {{- include "nexa.selectorLabels" (dict "component" "functions") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexa.selectorLabels" (dict "component" "functions") | nindent 8 }}
    spec:
      containers:
        - name: functions
          image: "{{ .Values.images.functions.repository }}:{{ .Values.images.functions.tag }}"
          command: ["start", "--main-service", "/home/deno/functions/main"]
          {{- include "nexa.envFrom" . | nindent 10 }}
          env:
            - { name: SUPABASE_URL, value: "http://kong:8000" }
            - name: SUPABASE_ANON_KEY
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: ANON_KEY } }
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: SERVICE_ROLE_KEY } }
            - { name: SUPABASE_PUBLISHABLE_KEYS, value: "{\"default\":\"$(SUPABASE_PUBLISHABLE_KEY)\"}" }
            - { name: SUPABASE_SECRET_KEYS, value: "{\"default\":\"$(SUPABASE_SECRET_KEY)\"}" }
            - name: SUPABASE_DB_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
          ports:
            - containerPort: 9000
          readinessProbe:
            tcpSocket: { port: 9000 }
            periodSeconds: 10
          volumeMounts:
            - { name: functions-main, mountPath: /home/deno/functions/main }
            - { name: functions-hello, mountPath: /home/deno/functions/hello }
            - { name: deno-cache, mountPath: /root/.cache/deno }
          resources:
            {{- toYaml .Values.resources.small | nindent 12 }}
      volumes:
        - name: functions-main
          configMap: { name: {{ include "nexa.fullname" . }}-functions-main }
        - name: functions-hello
          configMap: { name: {{ include "nexa.fullname" . }}-functions-hello }
        - name: deno-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: functions
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nexa.selectorLabels" (dict "component" "functions") | nindent 4 }}
  ports:
    - port: 9000
      targetPort: 9000
