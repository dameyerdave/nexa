{{- if .Values.cloudflared.enabled }}
# Cloudflare Tunnel client: makes an outbound-only connection to Cloudflare's
# edge, so the cluster needs no public IP / Ingress / LoadBalancer for
# traffic to reach it. Routing (which public hostname maps to which
# in-cluster service, e.g. http://portal:3000) is configured on the
# Cloudflare side (dashboard or `cloudflared tunnel route`), not here - this
# Deployment only needs the tunnel token to authenticate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexa.fullname" . }}-cloudflared
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cloudflared.replicaCount }}
  selector:
    matchLabels:
      {{- include "nexa.selectorLabels" (dict "component" "cloudflared") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexa.selectorLabels" (dict "component" "cloudflared") | nindent 8 }}
    spec:
      containers:
        - name: cloudflared
          image: "{{ .Values.images.cloudflared.repository }}:{{ .Values.images.cloudflared.tag }}"
          args: ["tunnel", "--no-autoupdate", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: CLOUDFLARE_TUNNEL_TOKEN } }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 15
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources.small | nindent 12 }}
{{- end }}
