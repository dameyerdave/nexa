# Two ConfigMaps because Postgres' docker-entrypoint-initdb.d needs these
# split across two subdirectories (same layout docker-compose.yml uses),
# and a ConfigMap volume mount is flat - each becomes its own volume,
# mounted at a different subPath in templates/statefulset-db.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexa.fullname" . }}-db-migrations
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
data:
  97-_supabase.sql: |-
{{ .Files.Get "files/db/_supabase.sql" | indent 4 }}
  99-realtime.sql: |-
{{ .Files.Get "files/db/realtime.sql" | indent 4 }}
  99-logs.sql: |-
{{ .Files.Get "files/db/logs.sql" | indent 4 }}
  99-pooler.sql: |-
{{ .Files.Get "files/db/pooler.sql" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexa.fullname" . }}-db-init-scripts
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
data:
  98-webhooks.sql: |-
{{ .Files.Get "files/db/webhooks.sql" | indent 4 }}
  99-roles.sql: |-
{{ .Files.Get "files/db/roles.sql" | indent 4 }}
  99-jwt.sql: |-
{{ .Files.Get "files/db/jwt.sql" | indent 4 }}
