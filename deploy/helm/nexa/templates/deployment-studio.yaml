apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexa.fullname" . }}-studio
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.studio }}
  selector:
    matchLabels:
      {{- include "nexa.selectorLabels" (dict "component" "studio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexa.selectorLabels" (dict "component" "studio") | nindent 8 }}
    spec:
      containers:
        - name: studio
          image: "{{ .Values.images.studio.repository }}:{{ .Values.images.studio.tag }}"
          {{- include "nexa.envFrom" . | nindent 10 }}
          env:
            - { name: HOSTNAME, value: "0.0.0.0" }
            - { name: STUDIO_PG_META_URL, value: "http://meta:8080" }
            - { name: POSTGRES_USER_READ_WRITE, value: postgres }
            - { name: SUPABASE_URL, value: "http://kong:8000" }
            - name: DEFAULT_ORGANIZATION_NAME
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: STUDIO_DEFAULT_ORGANIZATION } }
            - name: DEFAULT_PROJECT_NAME
              valueFrom: { configMapKeyRef: { name: {{ include "nexa.fullname" . }}-config, key: STUDIO_DEFAULT_PROJECT } }
            - name: SUPABASE_ANON_KEY
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: ANON_KEY } }
            - name: SUPABASE_SERVICE_KEY
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: SERVICE_ROLE_KEY } }
            - name: AUTH_JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "nexa.fullname" . }}-secrets, key: JWT_SECRET } }
            - { name: ENABLED_FEATURES_LOGS_ALL, value: "false" }
            - { name: SNIPPETS_MANAGEMENT_FOLDER, value: /app/snippets }
            - { name: EDGE_FUNCTIONS_MANAGEMENT_FOLDER, value: /app/edge-functions }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/platform/profile, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: snippets, mountPath: /app/snippets }
            - { name: functions-main, mountPath: /app/edge-functions/main }
            - { name: functions-hello, mountPath: /app/edge-functions/hello }
          resources:
            {{- toYaml .Values.resources.medium | nindent 12 }}
      volumes:
        - name: snippets
          emptyDir: {}
        - name: functions-main
          configMap: { name: {{ include "nexa.fullname" . }}-functions-main }
        - name: functions-hello
          configMap: { name: {{ include "nexa.fullname" . }}-functions-hello }
---
apiVersion: v1
kind: Service
metadata:
  name: studio   # unprefixed - referenced by name in kong.yml
  labels:
    {{- include "nexa.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nexa.selectorLabels" (dict "component" "studio") | nindent 4 }}
  ports:
    - port: 3000
      targetPort: 3000
