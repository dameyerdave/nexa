# Default values for the nexa chart.
#
# Nothing sensitive belongs in this file (it's committed to git). Real
# values for `secrets:` are supplied at deploy time via a generated
# values-secrets.yaml (see deploy/helm/nexa/README.md and the CI workflow)
# - the placeholders below are there so every expected key is documented in
# one place, mirroring .env.example at the repo root.

global:
  # Base domain the ingress/tunnel hosts are built from:
  #   portal    -> {{ domain }}
  #   kong/api  -> api.{{ domain }}
  #   metabase  -> analytics.{{ domain }}
  domain: nexdata.example.com
  # Set to false if you have no Ingress controller and are relying on
  # cloudflared.enabled (Cloudflare Tunnel) instead - the computed public
  # URLs in the ConfigMap still use `domain` above either way; only the
  # Ingress *objects* are skipped.
  ingressEnabled: true
  ingressClassName: nginx
  # Set to enable TLS via cert-manager (annotations + Ingress.spec.tls).
  # Leave empty to serve plain HTTP (fine for a first smoke test).
  clusterIssuer: ""
  # Set when TLS is terminated somewhere this chart doesn't manage (e.g. at
  # Cloudflare's edge via cloudflared.enabled) so the computed public URLs
  # are still built as https:// even though clusterIssuer is empty.
  tlsTerminatedExternally: false
  storageClassName: ""   # empty = cluster default

images:
  studio: { repository: supabase/studio, tag: "2026.07.07-sha-a6a04f2" }
  kong: { repository: kong/kong, tag: "3.9.1" }
  auth: { repository: supabase/gotrue, tag: "v2.189.0" }
  rest: { repository: postgrest/postgrest, tag: "v14.12" }
  realtime: { repository: supabase/realtime, tag: "v2.102.3" }
  storage: { repository: supabase/storage-api, tag: "v1.60.4" }
  imgproxy: { repository: darthsim/imgproxy, tag: "v3.30.1" }
  meta: { repository: supabase/postgres-meta, tag: "v0.96.6" }
  functions: { repository: supabase/edge-runtime, tag: "v1.74.0" }
  db: { repository: supabase/postgres, tag: "17.6.1.136" }
  supavisor: { repository: supabase/supavisor, tag: "2.9.5" }
  metabase: { repository: metabase/metabase, tag: "v0.53.13" }
  cloudflared: { repository: cloudflare/cloudflared, tag: "latest" }
  # Built and pushed by CI (.github/workflows/deploy.yml) - tag is set with
  # --set images.portal.tag=<git sha> at deploy time, not hand-edited here.
  portal: { repository: ghcr.io/OWNER/nexa-portal, tag: "latest" }

cloudflared:
  enabled: false
  replicaCount: 1

persistence:
  # The only PVC this chart provisions - kept to a minimum deliberately
  # (cloud block-storage volume quotas are often tight). Uploaded files
  # (storage/imgproxy) use an emptyDir instead of a PVC - see the note in
  # templates/deployment-storage.yaml for the trade-off and how to make
  # that durable again if you have PVC headroom to spare.
  db: { size: 10Gi }

resources:
  small: { requests: { cpu: 25m, memory: 64Mi }, limits: { memory: 256Mi } }
  medium: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
  large: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }

# ---------------------------------------------------------------------------
# Non-sensitive config -> ConfigMap. Keys match .env.example at the repo
# root 1:1 so the two stay easy to cross-reference. POSTGRES_HOST and other
# in-cluster service addresses are computed by the chart, not listed here.
# ---------------------------------------------------------------------------
config:
  POSTGRES_DB: postgres
  POSTGRES_PORT: "5432"

  STUDIO_DEFAULT_ORGANIZATION: "Default Organization"
  STUDIO_DEFAULT_PROJECT: "Default Project"

  JWT_EXPIRY: "3600"
  DISABLE_SIGNUP: "false"
  MAILER_URLPATHS_CONFIRMATION: "/auth/v1/verify"
  MAILER_URLPATHS_INVITE: "/auth/v1/verify"
  MAILER_URLPATHS_RECOVERY: "/auth/v1/verify"
  MAILER_URLPATHS_EMAIL_CHANGE: "/auth/v1/verify"
  ENABLE_EMAIL_SIGNUP: "true"
  ENABLE_EMAIL_AUTOCONFIRM: "true"
  SMTP_ADMIN_EMAIL: admin@example.com
  SMTP_HOST: ""
  SMTP_PORT: "2500"
  SMTP_USER: ""
  SMTP_SENDER_NAME: Nexdata
  ENABLE_ANONYMOUS_USERS: "false"
  ENABLE_PHONE_SIGNUP: "false"
  ENABLE_PHONE_AUTOCONFIRM: "false"

  GOOGLE_ENABLED: "false"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_AUTH_ALLOWED_DOMAIN: ""

  GLOBAL_S3_BUCKET: stub
  REGION: stub
  STORAGE_TENANT_ID: stub

  FUNCTIONS_VERIFY_JWT: "false"

  # Add an app's schema_namespace here (e.g. `biomed` for
  # apps/biomedical-studies) only after applying it - see apps/README.md -
  # a schema listed here that doesn't exist yet breaks PostgREST's startup.
  PGRST_DB_SCHEMAS: "public,graphql_public"
  PGRST_DB_MAX_ROWS: "1000"
  PGRST_DB_EXTRA_SEARCH_PATH: public

  IMGPROXY_AUTO_WEBP: "true"

  APP_NAME: Nexdata
  DATA_MODEL_LABEL: "Data Model"
  DATA_ANALYTICS_LABEL: "Data Analytics"

  # Comma-separated allowlist of emails treated as portal admins - they can
  # manage user roles at /admin/users (dbadmin: auto Studio access,
  # dashboardadmin: edit rights in Metabase). Leave empty and no one can
  # self-elevate; set it to your own account's email before first deploy.
  PORTAL_ADMIN_EMAILS: ""

  METABASE_ADMIN_EMAIL: admin@example.com
  METABASE_ADMIN_FIRST_NAME: Admin
  METABASE_ADMIN_LAST_NAME: User

  POOLER_TENANT_ID: your-tenant-id
  POOLER_DEFAULT_POOL_SIZE: "20"
  POOLER_MAX_CLIENT_CONN: "100"
  POOLER_DB_POOL_SIZE: "5"

  DASHBOARD_USERNAME: supabase

# ---------------------------------------------------------------------------
# Sensitive config -> Secret. Never fill these in here - see
# deploy/helm/nexa/README.md. Placeholder values below just document every
# key the chart expects; deploying with these as-is is intentionally
# insecure and only meant for a local smoke test (e.g. kind).
# ---------------------------------------------------------------------------
secrets:
  POSTGRES_PASSWORD: "changeme-postgres-password"
  JWT_SECRET: "changeme-jwt-secret-at-least-32-characters-long"
  ANON_KEY: ""
  SERVICE_ROLE_KEY: ""
  SUPABASE_PUBLISHABLE_KEY: ""
  SUPABASE_SECRET_KEY: ""
  JWT_KEYS: ""
  JWT_JWKS: ""
  ANON_KEY_ASYMMETRIC: ""
  SERVICE_ROLE_KEY_ASYMMETRIC: ""
  DASHBOARD_PASSWORD: "changeme-dashboard-password"
  SECRET_KEY_BASE: "changeme-secret-key-base-at-least-64-characters-long-000000000000"
  REALTIME_DB_ENC_KEY: "supabaserealtime"
  VAULT_ENC_KEY: "changeme-32-char-vault-enc-key-"
  PG_META_CRYPTO_KEY: "changeme-32-char-pg-meta-crypto-key"
  S3_PROTOCOL_ACCESS_KEY_ID: ""
  S3_PROTOCOL_ACCESS_KEY_SECRET: ""
  GOOGLE_SECRET: ""
  SMTP_PASS: ""
  METABASE_ADMIN_PASSWORD: "changeme-metabase-admin-password"
  OPENAI_API_KEY: ""
  # Only needed when cloudflared.enabled is true - a token from a tunnel
  # created in the Cloudflare Zero Trust dashboard (Networks > Tunnels).
  CLOUDFLARE_TUNNEL_TOKEN: ""

replicaCount:
  studio: 1
  kong: 1
  auth: 1
  rest: 2
  realtime: 1
  storage: 1   # also governs the imgproxy sidecar in the same pod
  meta: 1
  functions: 1
  supavisor: 1
  metabase: 1
  portal: 2
