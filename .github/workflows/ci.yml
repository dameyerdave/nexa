name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  portal-build:
    name: Build portal image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push - just verify it builds)
        uses: docker/build-push-action@v6
        with:
          context: ./portal
          push: false
