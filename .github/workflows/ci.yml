name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  portal-build:
    name: Build portal image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push - just verify it builds)
        uses: docker/build-push-action@v6
        with:
          context: ./portal
          push: false

  roles-api-build:
    name: Build roles-api image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push - just verify it builds)
        uses: docker/build-push-action@v6
        with:
          context: ./roles-api
          push: false

  helm-lint:
    name: Lint and render the Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/nexa
      - name: Template with placeholder secrets (catches missing keys/typos)
        run: |
          helm template nexa deploy/helm/nexa \
            --set global.domain=ci.example.com \
            --set images.portal.tag=ci \
            --set images.rolesApi.tag=ci > /tmp/rendered.yaml
      - name: Validate against the Kubernetes API schema
        run: |
          curl -sSLo kubeconform.tgz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tgz kubeconform
          ./kubeconform -strict -summary /tmp/rendered.yaml

  schema-compiler:
    name: Recompile apps/ schemas (fail if migrations/*.sql are stale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: pip install pyyaml
      - name: Recompile every app and diff against committed migrations
        run: |
          for app in apps/*/; do
            [ -f "$app/app.yml" ] || continue
            python3 scripts/compile_schema.py "$app"
          done
          git diff --exit-code -- 'apps/*/migrations' || {
            echo "::error::migrations/*.sql is out of date - run scripts/compile_schema.py and commit the result."
            exit 1
          }
