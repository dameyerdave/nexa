name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      domain:
        description: "Base domain (overrides the NEXA_DOMAIN repo variable for this run)"
        required: false
        type: string
      ingress_enabled:
        description: "Create Ingress objects (set false if using cloudflared instead)"
        required: false
        type: boolean
        default: true
      tls_terminated_externally:
        description: "TLS is terminated outside this chart (e.g. Cloudflare) - public URLs use https://"
        required: false
        type: boolean
        default: false
      cloudflared_enabled:
        description: "Deploy the Cloudflare Tunnel client"
        required: false
        type: boolean
        default: false
      clean_reinstall:
        description: "Uninstall the release first (keeps PVCs/data) - use if pods are stuck on a stale spec that a normal upgrade won't roll"
        required: false
        type: boolean
        default: false
      wipe_pvcs:
        description: "Also delete the db/metabase-db/storage PVCs (destroys all data) - only applies together with clean_reinstall"
        required: false
        type: boolean
        default: false
      storage_class:
        description: "StorageClass for PVCs (overrides the NEXA_STORAGE_CLASS repo variable) - empty uses the cluster default"
        required: false
        type: string

permissions:
  contents: read
  packages: write   # push the portal image to GHCR - no separate registry secret needed

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/nexa-portal
  ROLES_API_IMAGE: ghcr.io/${{ github.repository_owner }}/nexa-roles-api

jobs:
  build-portal:
    name: Build and push portal image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./portal
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest

  build-roles-api:
    name: Build and push roles-api image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./roles-api
          push: true
          tags: |
            ${{ env.ROLES_API_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.ROLES_API_IMAGE }}:latest

  deploy:
    name: Deploy to Kubernetes
    needs: [build-portal, build-roles-api]
    runs-on: ubuntu-latest
    environment: production   # requires a manual approver if you protect this GitHub Environment
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # TEMPORARY debug step - remove once NEXA_CLOUDFLARED_ENABLED resolves
      # correctly. Prints the raw value GitHub Actions sees for this repo
      # variable in this job's context, wrapped in brackets so leading/
      # trailing whitespace or unexpected casing is visible.
      - name: DEBUG - print NEXA_CLOUDFLARED_ENABLED
        run: echo "NEXA_CLOUDFLARED_ENABLED=[${{ vars.NEXA_CLOUDFLARED_ENABLED }}]"

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          kubectl cluster-info

      # kubectl-visible storage state, cluster-wide (not just the nexa
      # namespace) - so a Cinder "volume quota exceeded" error can be
      # cross-checked against what Kubernetes itself still thinks exists.
      # Only deletes PVs that are unambiguously safe: Released (already
      # unbound from any PVC) with reclaim policy Delete, where the CSI
      # driver's own delete-then-remove sequence has stalled - anything
      # else is left alone so we don't orphan a volume with no PV pointer
      # left to find it by later.
      - name: Cluster-wide storage diagnostics + safe cleanup
        run: |
          echo "### StorageClasses ###"
          kubectl get storageclass -o wide
          echo
          echo "### PersistentVolumes (all) ###"
          kubectl get pv -o wide || true
          echo
          echo "### PersistentVolumeClaims (all namespaces) ###"
          kubectl get pvc --all-namespaces -o wide || true
          echo
          stale_pvs=$(kubectl get pv -o json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for pv in data.get('items', []):
              phase = pv['status'].get('phase')
              policy = pv['spec'].get('persistentVolumeReclaimPolicy')
              if phase == 'Released' and policy == 'Delete':
                  print(pv['metadata']['name'])
          ")
          if [ -n "$stale_pvs" ]; then
            echo "### Deleting stale Released/Delete-policy PVs ###"
            echo "$stale_pvs" | xargs -r kubectl delete pv
          else
            echo "### No stale Released PVs found - nothing to clean up cluster-side ###"
          fi

      # Every secrets.* line below is a GitHub Actions secret -> a key in
      # the Helm chart's values.secrets map (deploy/helm/nexa/values.yaml).
      # See the "Required GitHub Actions secrets" section of the root
      # README for what each one is and how to generate it.
      - name: Write values-secrets.yaml
        run: |
          cat > values-secrets.yaml <<EOF
          secrets:
            POSTGRES_PASSWORD: "${{ secrets.POSTGRES_PASSWORD }}"
            JWT_SECRET: "${{ secrets.JWT_SECRET }}"
            ANON_KEY: "${{ secrets.ANON_KEY }}"
            SERVICE_ROLE_KEY: "${{ secrets.SERVICE_ROLE_KEY }}"
            SUPABASE_PUBLISHABLE_KEY: "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
            SUPABASE_SECRET_KEY: "${{ secrets.SUPABASE_SECRET_KEY }}"
            JWT_KEYS: "${{ secrets.JWT_KEYS }}"
            JWT_JWKS: "${{ secrets.JWT_JWKS }}"
            ANON_KEY_ASYMMETRIC: "${{ secrets.ANON_KEY_ASYMMETRIC }}"
            SERVICE_ROLE_KEY_ASYMMETRIC: "${{ secrets.SERVICE_ROLE_KEY_ASYMMETRIC }}"
            DASHBOARD_PASSWORD: "${{ secrets.DASHBOARD_PASSWORD }}"
            SECRET_KEY_BASE: "${{ secrets.SECRET_KEY_BASE }}"
            REALTIME_DB_ENC_KEY: "${{ secrets.REALTIME_DB_ENC_KEY }}"
            VAULT_ENC_KEY: "${{ secrets.VAULT_ENC_KEY }}"
            PG_META_CRYPTO_KEY: "${{ secrets.PG_META_CRYPTO_KEY }}"
            S3_PROTOCOL_ACCESS_KEY_ID: "${{ secrets.S3_PROTOCOL_ACCESS_KEY_ID }}"
            S3_PROTOCOL_ACCESS_KEY_SECRET: "${{ secrets.S3_PROTOCOL_ACCESS_KEY_SECRET }}"
            GOOGLE_SECRET: "${{ secrets.GOOGLE_SECRET }}"
            SMTP_PASS: "${{ secrets.SMTP_PASS }}"
            METABASE_ADMIN_PASSWORD: "${{ secrets.METABASE_ADMIN_PASSWORD }}"
            OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
            CLOUDFLARE_TUNNEL_TOKEN: "${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}"
            DJANGO_SECRET_KEY: "${{ secrets.DJANGO_SECRET_KEY }}"
            ROLES_API_TOKEN: "${{ secrets.ROLES_API_TOKEN }}"
            DJANGO_SUPERUSER_PASSWORD: "${{ secrets.DJANGO_SUPERUSER_PASSWORD }}"
          EOF

      - name: Uninstall existing release (clean_reinstall)
        if: github.event.inputs.clean_reinstall == 'true'
        run: |
          helm uninstall nexa --namespace nexa --wait --timeout 5m || true

      - name: Wipe PVCs (wipe_pvcs)
        if: github.event.inputs.clean_reinstall == 'true' && github.event.inputs.wipe_pvcs == 'true'
        run: |
          kubectl delete pvc data-nexa-db-0 data-nexa-metabase-db-0 nexa-storage \
            --namespace nexa --wait --timeout=2m --ignore-not-found

      - name: helm upgrade --install
        run: |
          helm upgrade --install nexa deploy/helm/nexa \
            --namespace nexa --create-namespace \
            -f values-secrets.yaml \
            --set images.portal.repository=${{ env.IMAGE }} \
            --set images.portal.tag=${{ needs.build-portal.outputs.tag }} \
            --set images.rolesApi.repository=${{ env.ROLES_API_IMAGE }} \
            --set images.rolesApi.tag=${{ needs.build-roles-api.outputs.tag }} \
            --set config.DJANGO_SUPERUSER_EMAIL="${{ vars.NEXA_ADMIN_EMAIL }}" \
            --set config.GOOGLE_ENABLED=${{ vars.NEXA_GOOGLE_ENABLED == 'true' }} \
            --set config.GOOGLE_CLIENT_ID="${{ vars.NEXA_GOOGLE_CLIENT_ID }}" \
            --set config.GOOGLE_AUTH_ALLOWED_DOMAIN="${{ vars.NEXA_GOOGLE_AUTH_ALLOWED_DOMAIN }}" \
            --set global.domain="${{ github.event.inputs.domain || vars.NEXA_DOMAIN }}" \
            --set global.ingressEnabled=${{ (github.event.inputs.ingress_enabled || vars.NEXA_INGRESS_ENABLED) != 'false' }} \
            --set global.ingressClassName="${{ vars.NEXA_INGRESS_CLASS || 'nginx' }}" \
            --set global.clusterIssuer="${{ vars.NEXA_CLUSTER_ISSUER }}" \
            --set global.tlsTerminatedExternally=${{ (github.event.inputs.tls_terminated_externally || vars.NEXA_TLS_TERMINATED_EXTERNALLY) == 'true' }} \
            --set cloudflared.enabled=${{ (github.event.inputs.cloudflared_enabled || vars.NEXA_CLOUDFLARED_ENABLED) == 'true' }} \
            --set global.storageClassName="${{ github.event.inputs.storage_class || vars.NEXA_STORAGE_CLASS }}" \
            --wait --timeout 10m

      - name: Diagnostics (always runs, even on failure/timeout)
        if: always()
        run: |
          echo "### Pods ###"
          kubectl get pods -n nexa -o wide || true
          echo
          echo "### PVCs ###"
          kubectl get pvc -n nexa -o wide || true
          echo
          echo "### StatefulSets / Deployments ###"
          kubectl get statefulsets,deployments -n nexa -o wide || true
          echo
          echo "### StorageClasses ###"
          kubectl get storageclass || true
          echo
          echo "### Events (sorted by time) ###"
          kubectl get events -n nexa --sort-by=.lastTimestamp || true
          echo
          echo "### describe: non-Running/non-Ready pods ###"
          for pod in $(kubectl get pods -n nexa --no-headers 2>/dev/null | awk '$2 !~ /^([0-9]+)\/\1$/ || $3 != "Running" {print $1}'); do
            echo "--- describe pod/$pod ---"
            kubectl describe pod "$pod" -n nexa || true
            # Per-container, not --all-containers: `--previous` errors out
            # entirely (aborting before printing anything) the moment ANY
            # container in the pod has never restarted - a multi-container
            # pod where only one container crashed would otherwise lose
            # every container's logs, not just the one with no history.
            for container in $(kubectl get pod "$pod" -n nexa -o jsonpath='{.spec.initContainers[*].name} {.spec.containers[*].name}'); do
              echo "--- logs pod/$pod container/$container (current, truncated) ---"
              kubectl logs "$pod" -n nexa -c "$container" --tail=100 || true
              echo "--- logs pod/$pod container/$container (previous, truncated) ---"
              kubectl logs "$pod" -n nexa -c "$container" --tail=100 --previous || true
            done
          done
          echo
          # nexa-db's Postgres init scripts only ever run once, against a
          # truly empty PGDATA - if the container crashes partway through
          # that first attempt and restarts, the retry sees a non-empty
          # data dir and silently skips init forever, masking whatever the
          # real error was. Capture its previous-container logs
          # unconditionally (not just when still unhealthy) so that first
          # attempt's output isn't lost once it recovers.
          echo "### nexa-db-0 db container previous-container logs (unconditional, untruncated) ###"
          kubectl logs nexa-db-0 -n nexa -c db --previous || true

      - name: Remove the secrets file from the runner
        if: always()
        run: rm -f values-secrets.yaml
