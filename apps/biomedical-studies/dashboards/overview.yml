# Applied with: python3 scripts/apply_dashboards.py apps/biomedical-studies
#
# `database` describes the Metabase connection to create/reuse - connection
# details (host/port/credentials) are filled in by apply_dashboards.py from
# .env, never written here. `schema` restricts what Metabase's own metadata
# sync/browser shows; native queries below always run directly against
# Postgres regardless, so they still need to schema-qualify table names
# (biomed.study, not just study).

database:
  name: biomed
  engine: postgres
  schema: biomed

cards:
  - name: "Active studies"
    description: "Studies currently in progress."
    display: scalar
    query: |
      select count(*) as active_studies
      from biomed.study
      where status = 'active'

  - name: "Specimens by type"
    description: "Collected specimens, grouped by type."
    display: bar
    query: |
      select specimen_type, count(*) as specimens
      from biomed.specimen
      group by specimen_type
      order by specimens desc

  - name: "Runs over time"
    description: "Instrument runs performed per day."
    display: line
    query: |
      select date_trunc('day', run_date) as day, count(*) as runs
      from biomed.run
      group by 1
      order by 1

  - name: "Raw files pending analysis"
    description: >
      Raw files with no analysis referencing them yet - a simple backlog
      indicator for the ingest-to-analysis pipeline.
    display: scalar
    query: |
      select count(*) as pending_raw_files
      from biomed.raw_file rf
      where not exists (
        select 1 from biomed.analysis_input ai where ai.raw_file_id = rf.id
      )

  - name: "Study overview"
    description: "One row per study: status and how much material/data it has."
    display: table
    query: |
      select
        s.code, s.title, s.status,
        count(distinct sub.id) as subjects,
        count(distinct sp.id) as specimens,
        count(distinct r.id) as runs
      from biomed.study s
      left join biomed.subject sub on sub.study_id = s.id
      left join biomed.specimen sp on sp.study_id = s.id
      left join biomed.run r on r.study_id = s.id
      group by s.id, s.code, s.title, s.status
      order by s.code

  - name: "Runs per protocol version"
    description: >
      Which protocol version is actually being used - useful to spot runs
      still on an old, superseded protocol version.
    display: bar
    query: |
      select p.name || ' v' || p.version as protocol, count(r.id) as runs
      from biomed.protocol p
      join biomed.run r on r.protocol_id = p.id
      group by p.id, p.name, p.version
      order by runs desc

dashboards:
  - name: "Biomedical studies overview"
    description: "Study progress, specimen/run volume, and pipeline backlog at a glance."
    layout:
      # x/y/w/h are grid units (Metabase's dashboard grid); a row of
      # scalars up top, then two charts, then the study table full-width.
      - {card: "Active studies", x: 0, y: 0, w: 6, h: 4}
      - {card: "Raw files pending analysis", x: 6, y: 0, w: 6, h: 4}
      - {card: "Specimens by type", x: 0, y: 4, w: 9, h: 6}
      - {card: "Runs per protocol version", x: 9, y: 4, w: 9, h: 6}
      - {card: "Runs over time", x: 0, y: 10, w: 18, h: 6}
      - {card: "Study overview", x: 0, y: 16, w: 18, h: 6}
