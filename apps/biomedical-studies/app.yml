id: biomedical-studies
name: Biomedical Study Metadata
version: "0.1.0"
description: >
  Tracks biomedical studies, the subjects/specimens they involve, the
  instrument runs performed on those specimens, and the full chain from
  raw instrument files through to derived/analyzed data - so that any
  result can be traced back to exactly the specimen, protocol version,
  instrument, and pipeline version that produced it.
schema_namespace: biomed
