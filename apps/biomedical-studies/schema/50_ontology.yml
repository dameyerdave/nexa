# Optional controlled-vocabulary layer. Free-text fields (specimen_type,
# assay_type, ...) work fine on their own; use entity_term_tag to
# progressively annotate any row with a real ontology term (UBERON, NCIT,
# SNOMED, ...) without having to migrate those columns to hard foreign
# keys. Not wired into any UI yet - this just makes the annotation possible
# once it's needed.

tables:
  - name: ontology_term
    description: "A single term from a controlled vocabulary."
    columns:
      - {name: id, type: uuid, primary_key: true, default: "gen_random_uuid()"}
      - {name: ontology, type: text, nullable: false, description: "e.g. UBERON, NCIT, SNOMED."}
      - {name: term_id, type: text, nullable: false, description: "e.g. UBERON:0000178."}
      - {name: label, type: text, nullable: false}
    unique:
      - [ontology, term_id]

  - name: entity_term_tag
    description: >
      Generic tag linking any row in this schema to an ontology term, e.g.
      (entity_table='specimen', entity_id=<specimen.id>) tagged with
      UBERON:0000178 ("blood").
    columns:
      - {name: id, type: uuid, primary_key: true, default: "gen_random_uuid()"}
      - {name: entity_table, type: text, nullable: false}
      - {name: entity_id, type: uuid, nullable: false}
      - {name: ontology_term_id, type: uuid, nullable: false, references: "ontology_term.id"}
    unique:
      - [entity_table, entity_id, ontology_term_id]
    indexes:
      - [entity_table, entity_id]
