# Actual file bytes live in Supabase Storage (S3-compatible), never in
# Postgres. Every *_file table here is a pointer: bucket + path + a
# sha256 checksum computed at ingestion time. The checksum is the
# reproducibility guarantee - it lets anyone verify, at any later point,
# that the bytes behind a result are exactly the bytes that were originally
# produced. Rows in raw_file/derived_file are treated as immutable once
# inserted: a correction is a new row (and, if needed, a new run/analysis),
# never an UPDATE of storage_path or checksum_sha256 on an existing row.

tables:
  - name: pipeline
    description: >
      A versioned analysis pipeline/workflow definition. Pin source_commit
      and/or container_image so an analysis row can point at the *exact*
      code that ran, not just a pipeline name.
    mixins: [auditable, supersedable]
    columns:
      - {name: id, type: uuid, primary_key: true, default: "gen_random_uuid()"}
      - {name: name, type: text, nullable: false, description: "e.g. rnaseq-star-salmon."}
      - name: version
        type: text
        nullable: false
        description: "Semver or git tag, e.g. 1.4.2."
      - {name: source_repo_url, type: text}
      - {name: source_commit, type: text, description: "Git commit SHA of the exact code that ran."}
      - name: container_image
        type: text
        description: "e.g. a docker image digest (sha256:...) - the strongest reproducibility anchor available."
      - {name: description, type: text}
    unique:
      - [name, version]

  - name: raw_file
    description: >
      A raw instrument output file, stored in Supabase Storage and pointed
      to from here. Always traceable to the run that produced it.
    mixins: [auditable]
    columns:
      - {name: id, type: uuid, primary_key: true, default: "gen_random_uuid()"}
      - {name: run_id, type: uuid, nullable: false, references: "run.id"}
      - {name: storage_bucket, type: text, nullable: false}
      - name: storage_path
        type: text
        nullable: false
        description: "Object key within the bucket. Must start with <study_id>/ - see 95_storage.yml, storage access policy relies on this."
      - {name: file_name, type: text, nullable: false}
      - {name: file_format, type: text, description: "e.g. fastq.gz, dicom, raw."}
      - {name: size_bytes, type: bigint}
      - name: checksum_sha256
        type: text
        nullable: false
        description: "SHA-256 of the file contents, computed at ingestion - the integrity/reproducibility anchor for this file."
      - {name: acquired_at, type: timestamptz, description: "When the instrument actually wrote the file, if different from run.run_date."}
    unique:
      - [storage_bucket, storage_path]
    indexes:
      - [run_id]
      - [checksum_sha256]

  - name: analysis
    description: >
      One execution of a pipeline (an "activity" in provenance terms):
      which pipeline version, who/what ran it, with which parameters, and
      what its inputs/outputs were (see analysis_input and derived_file).
    mixins: [auditable]
    columns:
      - {name: id, type: uuid, primary_key: true, default: "gen_random_uuid()"}
      - {name: pipeline_id, type: uuid, nullable: false, references: "pipeline.id"}
      - {name: run_by, type: uuid, references: "auth.users.id"}
      - {name: started_at, type: timestamptz}
      - {name: finished_at, type: timestamptz}
      - name: parameters
        type: jsonb
        nullable: false
        default: "'{}'::jsonb"
        description: "CLI args / config for this specific execution."
      - name: status
        type: text
        nullable: false
        default: "'running'"
        description: "running | succeeded | failed"
      - {name: log_storage_path, type: text, description: "Path to the execution log in Storage, if kept."}
    checks:
      - "status in ('running', 'succeeded', 'failed')"
    indexes:
      - [pipeline_id]

  - name: derived_file
    description: >
      An output of an analysis (processed/derived data), stored the same
      way as raw_file. Always traceable to the analysis that produced it,
      and from there to its pipeline and inputs.
    mixins: [auditable]
    columns:
      - {name: id, type: uuid, primary_key: true, default: "gen_random_uuid()"}
      - {name: analysis_id, type: uuid, nullable: false, references: "analysis.id"}
      - {name: storage_bucket, type: text, nullable: false}
      - name: storage_path
        type: text
        nullable: false
        description: "Object key within the bucket. Must start with <study_id>/ - see 95_storage.yml, storage access policy relies on this."
      - {name: file_name, type: text, nullable: false}
      - {name: file_format, type: text}
      - {name: size_bytes, type: bigint}
      - {name: checksum_sha256, type: text, nullable: false}
      - {name: data_type, type: text, description: "e.g. aligned-bam, count-matrix, qc-report."}
    unique:
      - [storage_bucket, storage_path]
    indexes:
      - [analysis_id]

  - name: analysis_input
    description: >
      Join table recording exactly which files fed an analysis - the other
      half of the provenance chain (an analysis can consume raw files,
      previously-derived files, or both, e.g. when chaining pipelines).
    columns:
      - {name: id, type: uuid, primary_key: true, default: "gen_random_uuid()"}
      - {name: analysis_id, type: uuid, nullable: false, references: "analysis.id", on_delete: cascade}
      - {name: raw_file_id, type: uuid, references: "raw_file.id"}
      - {name: derived_file_id, type: uuid, references: "derived_file.id"}
    checks:
      - "(raw_file_id is not null)::int + (derived_file_id is not null)::int = 1"
    indexes:
      - [analysis_id]
      - [raw_file_id]
      - [derived_file_id]
